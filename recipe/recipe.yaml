build:
  number: 1
  noarch: python
  script: ${{ PYTHON }} -m pip install "./${{ locale }}" -vv --no-deps

requirements:
  host:
    - hatchling >=1.4.0
    - jupyterlab-translate >=1.2.0
    - pip
    - python ${{ python_min }}.*
  run:
    - python >=${{ python_min }}

tests:
  - requirements:
      run:
        - pip
        - python ${{ python_min }}.*
    script:
      - pip check

about:
  summary: JupyterLab ${{ locale }} Language Pack
  license: BSD-3-Clause
  license_file: ${{ locale }}/LICENSE.txt
  homepage: https://github.com/jupyterlab/language-packs
  repository: https://github.com/jupyterlab/language-packs
  documentation: https://jupyterlab.readthedocs.io/

extra:
  feedstock-name: jupyterlab-language-packs
  recipe-maintainers:
    - blink1073
    - fcollonval
    - goanpeca
    - krassowski
