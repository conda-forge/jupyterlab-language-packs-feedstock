description = "Build jupyterlab-language-packs-feedstock with variant linux_64_localezh-TW directly (without setup scripts)"
[feature.build.tasks."debug-linux_64_localezh-TW"]
cmd = "rattler-build debug setup --recipe recipe -m .ci_support/linux_64_localezh-TW.yaml "
description = "Debug jupyterlab-language-packs-feedstock with variant linux_64_localezh-TW directly (without setup scripts)"
[feature.build.tasks."inspect-linux_64_localezh-TW"]
cmd = "inspect_artifacts --recipe-dir recipe -m .ci_support/linux_64_localezh-TW.yaml"
description = "List contents of jupyterlab-language-packs-feedstock packages built for variant linux_64_localezh-TW"

[environments]
build = ["build"]
# This is a copy of 'build', to be enabled by build_steps.sh during Docker builds
# __PLATFORM_SPECIFIC_ENV__ = ["build"]
